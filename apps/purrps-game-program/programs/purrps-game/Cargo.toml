[package]
name = "purrps-game"
version = "0.1.0"
description = "PURRPS vault, wager and settlement program"
edition.workspace = true
rust-version.workspace = true
autotests = false

[[test]]
name = "run_delivery"
path = "../../../../tests/apps/purrps-game-program/run-delivery.rs"

[[test]]
name = "custody"
path = "../../../../tests/apps/purrps-game-program/custody.rs"

[[test]]
name = "rule_contracts"
path = "../../../../tests/apps/purrps-game-program/rule-contracts.rs"

[[test]]
name = "test_initialize"
path = "../../../../tests/apps/purrps-game-program/initialize.rs"

[[test]]
name = "account_contracts"
path = "../../../../tests/apps/purrps-game-program/account-contracts.rs"

[[test]]
name = "protocol_contracts"
path = "../../../../tests/apps/purrps-game-program/protocol-contracts.rs"

[[test]]
name = "publication_contracts"
path = "../../../../tests/apps/purrps-game-program/publication-contracts.rs"

[[test]]
name = "program_admin"
path = "../../../../tests/apps/purrps-game-program/program-admin.rs"

[[test]]
name = "simulation"
path = "../../../../tests/apps/purrps-game-program/simulation.rs"

[[test]]
name = "world_generation"
path = "../../../../tests/apps/purrps-game-program/world-generation.rs"

[lib]
crate-type = ["cdylib", "lib"]
name = "purrps_game"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "session-keys/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "=1.1.2"
anchor-spl = "=1.1.2"
ephemeral-rollups-sdk = { version = "=0.17.3", default-features = false, features = ["anchor", "vrf", "crank", "solana-system-interface"] }
session-keys = { version = "=3.1.1", features = ["no-entrypoint"] }
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }

[dev-dependencies]
litesvm = "=0.10.0"
solana-message = "=3.1.0"
solana-transaction = "=3.1.0"
solana-signer = "=3.0.1"
solana-keypair = "=3.1.2"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
