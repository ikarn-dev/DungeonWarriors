[package]
name = "dungeon-warriors"
version = "0.1.0"
description = "Dungeon Warriors vault, wager and settlement program"
edition.workspace = true
rust-version.workspace = true
autotests = false

[[test]]
name = "play_authorization"
path = "../../../../tests/apps/dungeon-warriors-program/play-authorization.rs"

[[test]]
name = "starter"
path = "../../../../tests/apps/dungeon-warriors-program/starter.rs"

[[test]]
name = "run_delivery"
path = "../../../../tests/apps/dungeon-warriors-program/run-delivery.rs"

[[test]]
name = "custody"
path = "../../../../tests/apps/dungeon-warriors-program/custody.rs"

[[test]]
name = "rule_contracts"
path = "../../../../tests/apps/dungeon-warriors-program/rule-contracts.rs"

[[test]]
name = "test_initialize"
path = "../../../../tests/apps/dungeon-warriors-program/initialize.rs"

[[test]]
name = "account_contracts"
path = "../../../../tests/apps/dungeon-warriors-program/account-contracts.rs"

[[test]]
name = "protocol_contracts"
path = "../../../../tests/apps/dungeon-warriors-program/protocol-contracts.rs"

[[test]]
name = "publication_contracts"
path = "../../../../tests/apps/dungeon-warriors-program/publication-contracts.rs"

[[test]]
name = "program_admin"
path = "../../../../tests/apps/dungeon-warriors-program/program-admin.rs"

[[test]]
name = "simulation"
path = "../../../../tests/apps/dungeon-warriors-program/simulation.rs"

[[test]]
name = "world_generation"
path = "../../../../tests/apps/dungeon-warriors-program/world-generation.rs"

[lib]
crate-type = ["cdylib", "lib"]
name = "dungeon_warriors"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "session-keys/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = "=1.1.2"
ephemeral-rollups-sdk = { version = "=0.17.3", default-features = false, features = ["anchor", "vrf", "crank", "instruction", "solana-system-interface"] }
session-keys = { version = "=3.1.1", features = ["no-entrypoint"] }
hydra-api = { version = "=0.2.1", features = ["cpi-native", "ephemeral"] }
solana-instructions-sysvar = "=3.0.1"
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }

[dev-dependencies]
bincode = "=1.3.3"
magicblock-magic-program-api = "=0.10.1"
solana-program-runtime = "=3.1.14"
litesvm = "=0.10.0"
solana-message = "=3.1.0"
solana-transaction = "=3.1.0"
solana-signer = "=3.0.1"
solana-keypair = "=3.1.2"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
